Match host *.example.com user alice
    Port 2200
    ProxyCommand ssh -W %h:%p bastion
Match originalhost web1 exec "test -f /nonexistent"
    ForwardAgent yes
Match canonical all
    PubkeyAuthentication yes
Match localnetwork 10.0.0.0/8
    VisualHostKey yes
Host *
    CertificateFile ~/.ssh/id_ed25519-cert.pub
    PermitRemoteOpen host1:80 *:443
    RequestTTY auto
    EscapeChar ~
    UserKnownHostsFile ~/.ssh/known_hosts /dev/null
    StreamLocalBindUnlink yes
    Tag work
    RekeyLimit 1G 1h
    CASignatureAlgorithms ssh-ed25519
    ChannelTimeout session=5m
    ObscureKeystrokeTiming yes
    ProxyUseFdpass no
    TunnelDevice 0:any
    Tunnel point-to-point
    AddressFamily inet
    BatchMode no
    CheckHostIP no
    ConnectTimeout 15
    ConnectionAttempts 2
    NumberOfPasswordPrompts 3
